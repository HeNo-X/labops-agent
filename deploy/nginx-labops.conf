# LabOps 对外入口（2026-10-04 起：去掉 basic auth，改为直链 + 限流兜底）
# 带口令的历史版本见同目录 nginx-labops.conf.with-auth
limit_req_zone $binary_remote_addr zone=labops:10m rate=60r/m;

server {
    listen 8788 ssl http2;
    server_name lab.example.edu;

    ssl_certificate     /etc/nginx/ssl/lab/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/lab/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    location / {
        # 限流兜底：LabOps 自身无入站鉴权且用到计费模型，
        # 公开直链下用它压住"单 IP 高频刷"（正常演示远达不到 60 次/分/IP）
        limit_req zone=labops burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 10m;
    }
}
