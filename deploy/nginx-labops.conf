# LabOps 对外入口：直链 + 限流兜底
# 需要口令保护的部署可改用同目录 nginx-labops.conf.with-auth
# http context: writes/models and reads use independent keys and quotas.
map $request_method $labops_read_key { default ""; GET $binary_remote_addr; HEAD $binary_remote_addr; }
# OPTIONS validates CORS and does not perform a write; it must not consume this quota.
map $request_method $labops_write_key { default $binary_remote_addr; GET ""; HEAD ""; OPTIONS ""; }
limit_req_zone $labops_read_key zone=labops_reads:10m rate=120r/s;
limit_req_zone $labops_write_key zone=labops_writes:10m rate=120r/m;

server {
    listen 8788 ssl http2;
    # 示例占位：部署时替换为实际域名（公开仓库不放真实部署地址）
    server_name lab.example.edu;

    ssl_certificate     /etc/nginx/ssl/lab/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/lab/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    include /etc/nginx/snippets/qz-api-errors.conf;

    # Authenticated APIs: account limits are also enforced by both servers.
    location /api/ {
        limit_req zone=labops_reads burst=240 nodelay;
        limit_req zone=labops_writes burst=60 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/labops-proxy.conf;
    }
    # Both fixed HTML entries must observe current chunk hashes.
    location / {
        include /etc/nginx/snippets/labops-proxy.conf;
    }
}
