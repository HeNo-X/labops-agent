<!doctype html><html lang="zh-CN"><head>
    <script src="lib/client-runtime.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>启真 · 业务工作台</title>
<style>
:root{color-scheme:light;font-family:system-ui,"Microsoft YaHei",sans-serif;color:#22344d;background:#f1f5f9}*{box-sizing:border-box}body{margin:0}header{padding:25px max(20px,calc((100vw - 1180px)/2));background:#17344e;color:white}h1{margin:0;font-size:24px}header p{color:#c3d8e5;font-size:14px;margin:9px 0}main{max-width:1220px;margin:auto;padding:24px 20px}nav{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}button,.link{border:1px solid #cbd7e2;border-radius:8px;background:white;color:#263e55;padding:10px 16px;cursor:pointer;font:inherit;text-decoration:none}button.primary,nav button.active{background:#126e76;color:white;border-color:#126e76}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #eabf56;outline-offset:2px}.card{background:white;border:1px solid #dce4ed;border-radius:12px;padding:22px;margin:16px 0;box-shadow:0 3px 12px #18334d06}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}label{display:block;font-size:14px;margin:12px 0 6px}input,select,textarea{width:100%;font:inherit;border:1px solid #bbcbd9;border-radius:7px;padding:10px;background:white;color:inherit}textarea{min-height:80px}h2{font-size:20px;margin-top:0}h3{font-size:16px}.muted{color:#5a6b7d;font-size:14px;line-height:1.7}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#eef6f5;color:#195b57;font-size:13px}.warn{color:#85521d;background:#fff4df}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:12px;text-align:left;border-bottom:1px solid #e3eaf1}th{background:#f7f9fb;white-space:nowrap}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;line-height:1.7}#status{position:sticky;top:0;padding:12px 18px;background:#eaf4f5;border-radius:8px;z-index:2;white-space:pre-wrap}#status:empty{display:none}.error{background:#fff0eb!important;color:#8c3925}dialog{border:0;border-radius:14px;padding:28px;max-width:640px;width:calc(100% - 30px);box-shadow:0 20px 80px #132a4b40}dialog::backdrop{background:#182a4599}footer{padding:28px;text-align:center;color:#62758b;font-size:13px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.split{display:flex;justify-content:space-between;align-items:center;gap:12px}.hide{display:none!important}@media(max-width:650px){header{padding:20px}main{padding:12px}.card{padding:16px}h1{font-size:21px}th,td{padding:9px}}
</style></head><body><header><div class="split"><h1>启真 · 业务工作台</h1><a class="link" href="/" target="_top">返回首页</a></div><p>故障影响与调课 · 值班现场检查与交接</p><div id="identity">请先登录后使用</div></header><main><div id="status" role="status" aria-live="polite"></div>
<section id="login" class="card"><h2>账号登录</h2><p class="muted">使用实验室管理系统账号登录。办理方案确认后提交，结果可在本工作台回查。</p><form id="login-form" class="grid"><div><label for="account">账号</label><input id="account" autocomplete="username" required></div><div><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required></div><div style="align-self:end"><button class="primary" type="submit">登录</button></div></form></section>
<div id="workspace" class="hide"><nav id="tabs" aria-label="业务导航"></nav><section id="content"></section><section class="card"><h2>待确认方案</h2><div id="pending"></div></section><section class="card"><h2>最近业务回执</h2><div id="receipts"></div></section><button id="logout">退出登录</button></div>
</main><dialog id="confirm"><h2>核对本次办理</h2><pre id="plan-summary"></pre><p class="muted">提交时会再次核对身份、方案内容与有效期。如连接中断，请用同一方案重试，可通过业务编号查询结果。</p><div class="row"><button id="commit" class="primary">确认提交</button><button id="reject">放弃方案</button><button id="close">返回修改</button></div></dialog><footer>现场检查记录由检查人现场确认。</footer>
<script src="lib/operations-ui.js"></script></body></html>
